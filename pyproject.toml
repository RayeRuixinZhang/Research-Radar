[project]
name = "research-radar"
version = "0.1.0"
description = "Traceable weekly medical research intelligence radar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "RayeRuixinZhang", email = "zrxzrx1227@163.com" }]
dependencies = [
  "boto3>=1.34,<2",
  "feedparser>=6.0.11,<7",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
research-radar = "research_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

