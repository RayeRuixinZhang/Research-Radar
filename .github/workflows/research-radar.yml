name: Research Radar Weekly

on:
  schedule:
    - cron: "33 5 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Run the 365-day PubMed + SCImago Q1 backfill"
        required: false
        type: boolean
        default: false

concurrency:
  group: research-radar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      report_changed: ${{ steps.commit.outputs.changed }}
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Environment doctor
        run: python -m research_radar doctor

      - name: Optional 365-day backfill
        if: github.event_name == 'workflow_dispatch' && inputs.full_backfill
        run: python -m research_radar backfill --days 365 --retmax 2000

      - name: Collect previous week
        run: python -m research_radar collect --days 7

      - name: Build report and send configured email
        run: python -m research_radar build-report --send-email

      - name: Commit traceable report and manifest
        id: commit
        run: |
          git config user.name "research-radar[bot]"
          git config user.email "zrxzrx1227@163.com"
          git add reports manifests
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add Research Radar report $(date -u +%G-W%V)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

